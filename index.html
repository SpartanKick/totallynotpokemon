<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#100E16">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Wildmoor">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Wildmoor Packs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EFEDF5; --surface:#FFFFFF; --surface2:#E8E5F1; --ink:#1B1724; --muted:#6A6578; --line:#DAD6E7;
  --heather:#6B45B8; --gorse:#C98F00; --moss:#2F7A57; --on-accent:#FFFFFF;
  --display:"Sora","Avenir Next","Trebuchet MS",sans-serif;
  --body:"Figtree","Segoe UI",Verdana,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#100E16; --surface:#1A1722; --surface2:#241F30; --ink:#F1EEF8; --muted:#9D97AE; --line:#2E2840;
    --heather:#B79BF0; --gorse:#F2C24B; --moss:#6CCB9B; --on-accent:#17121F;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#100E16; --surface:#1A1722; --surface2:#241F30; --ink:#F1EEF8; --muted:#9D97AE; --line:#2E2840;
  --heather:#B79BF0; --gorse:#F2C24B; --moss:#6CCB9B; --on-accent:#17121F;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--heather);outline-offset:3px;border-radius:6px}
img{max-width:100%}

.app{max-width:560px;margin:0 auto;padding:16px 16px 110px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px}
.brand{font-family:var(--display);font-weight:800;font-size:1.75rem;letter-spacing:-.02em;line-height:1;margin:0}
.setpick{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.setpick label{font-size:.75rem;color:var(--muted)}
select{background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:6px 10px;max-width:200px}
.sub{color:var(--muted);font-size:.9rem;margin:0 0 18px}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1.5px solid var(--line);
  padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;gap:6px}
nav.tabs button{flex:1;max-width:170px;background:none;border:0;border-radius:12px;padding:10px 6px;font-weight:700;color:var(--muted)}
nav.tabs button[aria-current="page"]{background:var(--ink);color:var(--bg)}

.btn{border:0;border-radius:999px;padding:12px 22px;font-weight:700;background:var(--heather);color:var(--on-accent)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.small{padding:8px 14px;font-size:.9rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

/* ---------- Pack ---------- */
.stage{display:flex;flex-direction:column;align-items:center;gap:14px;min-height:520px;justify-content:center;position:relative}
.hint{color:var(--muted);font-size:.95rem;margin:0;text-align:center;transition:color .25s,transform .25s}
.hint.pulse{color:var(--ink);animation:hintpulse .5s ease-out}
@keyframes hintpulse{40%{transform:scale(1.06)}}
.count{font-family:var(--display);font-weight:700;color:var(--muted)}
.packzone{position:relative;display:flex;align-items:center;justify-content:center;padding:30px 28px;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:grab}
.packzone:active{cursor:grabbing}
.slashfx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible;z-index:8}
.slashfx path{fill:none;stroke:#fff;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 5px #FFF3C4) drop-shadow(0 0 14px #F2C24B)}
.slashfx.fade{opacity:0;transition:opacity .35s}
.pack{position:relative;display:block;width:min(60vw,232px);aspect-ratio:5/8;container-type:inline-size;border:0;padding:0;background:none;
  filter:drop-shadow(0 26px 26px rgba(8,4,18,.55));animation:float 4.2s ease-in-out infinite;-webkit-tap-highlight-color:transparent}
@keyframes float{50%{transform:translateY(-9px)}}
.pack.dragging,.pack.torn{animation:none}
.pack.nudge{animation:nudge .42s ease-out}
@keyframes nudge{25%{transform:translateX(-7px) rotate(-1.5deg)}60%{transform:translateX(7px) rotate(1.5deg)}100%{transform:none}}
.pack3d{position:absolute;inset:0;transform-style:preserve-3d;transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .16s ease-out}
.piece{position:absolute;inset:0}
.piece.top{clip-path:var(--clipTop);transform-origin:0 13%}
.piece.bot{clip-path:var(--clipBot)}
.foil{position:absolute;inset:0;background:
  linear-gradient(90deg,rgba(0,0,0,.34) 0,rgba(0,0,0,0) 5%,rgba(255,255,255,.16) 6%,rgba(255,255,255,0) 8%,rgba(255,255,255,0) 92%,rgba(0,0,0,0) 95%,rgba(0,0,0,.34) 100%),
  radial-gradient(130% 55% at 18% 0%,rgba(255,255,255,.4),transparent 58%),
  repeating-linear-gradient(100deg,rgba(255,255,255,0) 0 9px,rgba(255,255,255,.07) 9px 10px),
  linear-gradient(168deg,#2B1B4E 0%,#5A3992 36%,#3C5EA3 62%,#2C7B5D 100%)}
.packholo{position:absolute;inset:0;pointer-events:none;opacity:.2;
  background:radial-gradient(circle at var(--mx,30%) var(--my,22%),rgba(255,255,255,.85),transparent 42%),
    repeating-linear-gradient(115deg,rgba(255,122,122,.85) 0%,rgba(255,211,107,.85) 7%,rgba(140,245,168,.85) 14%,rgba(122,211,255,.85) 21%,rgba(201,149,255,.85) 28%,rgba(255,122,122,.85) 35%);
  background-size:100% 100%,300% 300%;background-position:center,var(--mx,30%) var(--my,22%)}
.packglare{position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(105deg,transparent 34%,rgba(255,255,255,.22) 48%,transparent 60%);background-size:260% 100%;animation:sheen 3.6s ease-in-out infinite}
@keyframes sheen{0%{background-position:125% 0}60%,100%{background-position:-45% 0}}
.rays{position:absolute;left:50%;top:51%;width:150%;aspect-ratio:1;transform:translate(-50%,-50%);pointer-events:none;
  background:repeating-conic-gradient(rgba(255,255,255,.14) 0 6deg,transparent 6deg 18deg);
  -webkit-mask:radial-gradient(circle,#000 12%,transparent 60%);mask:radial-gradient(circle,#000 12%,transparent 60%);animation:spin 70s linear infinite}
.ribs{position:absolute;left:0;right:0;height:7.5%;background:repeating-linear-gradient(90deg,rgba(10,4,24,.36) 0 .9cqw,rgba(255,255,255,.22) .9cqw 1.8cqw)}
.ribs.t{top:0;-webkit-mask:linear-gradient(#000 55%,transparent);mask:linear-gradient(#000 55%,transparent)}
.ribs.b{bottom:0;-webkit-mask:linear-gradient(transparent,#000 45%);mask:linear-gradient(transparent,#000 45%)}
.content{position:absolute;left:0;right:0;top:16%;bottom:10%;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:0 8%}
.ptitle{font-family:var(--display);font-weight:800;font-size:13.5cqw;line-height:1;text-align:center;letter-spacing:-.04em;max-width:100%;overflow-wrap:anywhere;
  background:linear-gradient(180deg,#FFF6CF 0%,#F2C24B 55%,#B7791F 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 .7cqw 0 rgba(50,24,0,.55)) drop-shadow(0 0 3cqw rgba(242,194,75,.3))}
.medal{width:72%;aspect-ratio:1;border-radius:50%;padding:3cqw;flex:none;
  background:conic-gradient(from 20deg,#FFF1B8,#E2A92B,#8A5A12,#F7D774,#FFF1B8);
  box-shadow:0 2.4cqw 5cqw rgba(0,0,0,.5),0 0 0 1.4cqw rgba(255,255,255,.12)}
.medal-in{width:100%;height:100%;border-radius:50%;overflow:hidden;background:#2a1b4a;box-shadow:inset 0 0 4cqw rgba(0,0,0,.45)}
.medal-in svg,.medal-in img{width:100%;height:100%;display:block;object-fit:cover}
.chips{display:flex;gap:1.8cqw;flex-wrap:wrap;justify-content:center}
.chips span{font-size:4.3cqw;font-weight:700;color:#FFF1B8;background:rgba(15,8,30,.55);border:1px solid rgba(242,194,75,.55);padding:1.1cqw 3cqw;border-radius:99px;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.seam{position:absolute;left:9%;right:9%;top:8.4%;display:flex;align-items:center;gap:2cqw;color:rgba(255,255,255,.92);font-size:3.9cqw;font-weight:650;letter-spacing:.04em}
.seam i{flex:1;border-top:.6cqw dashed rgba(255,255,255,.6)}
.slit{position:absolute;left:-3%;right:-3%;top:13%;height:4px;margin-top:-2px;border-radius:4px;z-index:3;pointer-events:none;
  background:linear-gradient(90deg,transparent,#fff 14%,#fff 86%,transparent);box-shadow:0 0 16px 5px #FFF3C4,0 0 38px 10px rgba(242,194,75,.55);
  opacity:calc(var(--tear,0) * 1.5);transform:scaleX(var(--tear,0));transform-origin:var(--origin,0%) 50%}
.pack:not(.dragging) .slit{transition:transform .25s,opacity .25s}
.burst{position:absolute;left:50%;top:13%;width:220%;aspect-ratio:1;border-radius:50%;pointer-events:none;z-index:4;opacity:0;
  background:radial-gradient(circle,rgba(255,246,207,.95),rgba(255,246,207,0) 58%);transform:translate(-50%,-50%) scale(.2)}
.pack.torn .piece.top{animation:tearaway .62s cubic-bezier(.4,0,.8,.5) forwards}
@keyframes tearaway{to{transform:translate(calc(var(--dir,1) * 120px),-150px) rotate(calc(var(--dir,1) * 42deg));opacity:0}}
.pack.torn .piece.bot{animation:dropaway .55s .34s cubic-bezier(.5,0,.9,.5) forwards}
@keyframes dropaway{to{transform:translateY(110px) scale(.9);opacity:0}}
.pack.torn .slit{animation:slitflash .5s ease-out forwards}
@keyframes slitflash{0%{opacity:1;transform:scaleX(1)}100%{opacity:0;transform:scaleX(1.08) scaleY(6)}}
.pack.torn .burst{animation:burstout .75s ease-out forwards}
@keyframes burstout{25%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1.15)}}

/* ---------- Cards ---------- */
.card{--mx:50%;--my:50%;--rx:0deg;--ry:0deg;position:relative;width:var(--w,260px);aspect-ratio:63/88;container-type:inline-size;border-radius:4.5cqw;transform-style:preserve-3d}
.card .face{position:absolute;inset:0;border-radius:inherit;overflow:hidden;background:var(--frame,#ccc);padding:3.6cqw;display:flex;flex-direction:column;gap:2.2cqw;color:#1E2A23;
  box-shadow:0 1px 0 rgba(255,255,255,.4) inset,0 10px 24px rgba(20,30,25,.25)}
.card .inner{flex:1;display:flex;flex-direction:column;gap:2.2cqw;background:var(--paper,#F7F4EC);border-radius:3cqw;padding:3cqw;min-height:0}
.card .top{display:flex;justify-content:space-between;align-items:baseline;gap:2cqw}
.card .nm{font-family:var(--display);font-weight:800;font-size:8.2cqw;line-height:1.05;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .hp{font-family:var(--display);font-weight:700;font-size:5.6cqw;white-space:nowrap}
.card .hp b{font-size:7.4cqw}
.card .art{position:relative;aspect-ratio:4/3;border-radius:2cqw;overflow:hidden;background:var(--artbg);box-shadow:0 0 0 .8cqw rgba(0,0,0,.18) inset}
.card .art svg,.card .art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.card .meta{display:flex;justify-content:space-between;font-size:4.4cqw;color:#5A675E}
.card .move{display:flex;justify-content:space-between;align-items:center;border-top:.5cqw solid rgba(0,0,0,.12);padding-top:2.4cqw;font-weight:700;font-size:5.6cqw}
.card .move span:last-child{font-family:var(--display);font-size:7cqw}
.card .foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;font-size:4.2cqw;color:#5A675E}
.card .sym{font-size:5.4cqw;color:#1E2A23}
.card .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:6cqw;font-family:var(--display);font-weight:700;font-size:7cqw;color:#5A675E;background:repeating-linear-gradient(45deg,#ECE8DE 0 6px,#E3DED2 6px 12px)}

/* full-art imported scans */
.card.scan .face{padding:0;background:#222}
.card.scan .face>img{width:100%;height:100%;object-fit:cover;display:block}

/* ultra: full art */
.card.ultra .inner{background:transparent;padding:0;position:relative}
.card.ultra .art{position:absolute;inset:0;aspect-ratio:auto;border-radius:3cqw}
.card.ultra .top,.card.ultra .move,.card.ultra .foot,.card.ultra .meta{position:relative;z-index:2;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.card.ultra .top{padding:3cqw 3cqw 0}
.card.ultra .move{margin-top:auto;padding:2.4cqw 3cqw 0;border-color:rgba(255,255,255,.4)}
.card.ultra .meta{padding:0 3cqw}
.card.ultra .foot{margin-top:0;padding:0 3cqw 3cqw}
.card.ultra .sym{color:#fff}
.card.ultra .art::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,15,30,.55) 0%,transparent 22%,transparent 62%,rgba(20,15,30,.7) 100%)}
.card.ultra .face{background:linear-gradient(135deg,#F6D365,#FDA085,#C49BDB,#7FD1E8,#B5E48C,#F6D365);background-size:300% 300%;animation:rainbow 8s linear infinite}
@keyframes rainbow{to{background-position:300% 300%}}

/* imported card images: skeleton while loading, fade in when ready */
.card.scan .face{background:linear-gradient(110deg,#25252d 30%,#35353f 50%,#25252d 70%);background-size:220% 100%;animation:skel 1.3s linear infinite}
@keyframes skel{to{background-position:-120% 0}}
img[data-name]{opacity:0;transition:opacity .35s}
img[data-name].ok{opacity:1}
.card .art{background-color:var(--artbg)}

/* foil */
.card .foil{position:absolute;inset:0;border-radius:inherit;overflow:hidden;pointer-events:none;z-index:3;
  background:linear-gradient(125deg,rgba(255,122,160,.15) 0%,rgba(255,211,107,.15) 22%,rgba(140,245,168,.15) 44%,rgba(122,211,255,.15) 66%,rgba(201,149,255,.15) 88%)}
.card .foil i{position:absolute;top:-10%;bottom:-10%;left:-60%;width:50%;
  background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.32),rgba(255,255,255,0));
  transform:skewX(-18deg);animation:foilsweep 4.8s ease-in-out infinite}
@keyframes foilsweep{0%{transform:skewX(-18deg) translateX(0)}55%,100%{transform:skewX(-18deg) translateX(420%)}}
body.nofoil .card .foil,body.nofoil .packholo,body.nofoil .packglare{display:none}
.card.tilt{transform:perspective(900px) rotateX(var(--rx)) rotateY(var(--ry));transition:transform .12s ease-out}

.card .back{position:absolute;inset:0;border-radius:inherit;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;transform:rotateY(180deg);
  background:radial-gradient(circle at 50% 50%,#7A4E8C 0 18%,transparent 18.5%),
    repeating-radial-gradient(circle at 50% 50%,#3F6B4A 0 7cqw,#355C3F 7cqw 14cqw);
  border:4cqw solid #2A3F2F;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 24px rgba(20,30,25,.25)}
.card .back span{font-family:var(--display);font-weight:800;color:#F3F5EE;font-size:8cqw;background:#2A3F2F;padding:1.5cqw 4cqw;border-radius:99px}

/* flipper */
.flipper{position:relative;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.3,.7,.3,1);transform:rotateY(180deg)}
.flipper.up{transform:rotateY(0)}
.flipper .card .face,.flipper .card .foil{backface-visibility:hidden;-webkit-backface-visibility:hidden}
.flipper.out{transition:transform .35s ease-in,opacity .35s;transform:translateX(-120%) rotate(-12deg);opacity:0}
.flipper.glow-rare .back{box-shadow:0 0 0 3px #F0B443,0 0 36px 8px rgba(240,180,67,.7)}
.flipper.glow-holo .back{box-shadow:0 0 0 3px #C995FF,0 0 44px 12px rgba(122,211,255,.75);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 3px #FFD36B,0 0 56px 16px rgba(201,149,255,.8)}}
.stagebtn{background:none;border:0;padding:0;border-radius:5%}
.badge{position:absolute;top:-10px;right:-10px;z-index:5;background:var(--gorse);color:#1E2A23;font-weight:800;font-family:var(--display);font-size:.8rem;padding:3px 10px;border-radius:99px;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.raritynote{font-family:var(--display);font-weight:700;min-height:1.6em;margin:0}

.pulls{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 8px;width:100%;justify-items:center}
.pulls .cell:not(.best) .badge{font-size:.65rem;padding:2px 7px;top:-8px;right:-4px}
.pulls .cell{position:relative;width:100%}

/* ---------- Binder ---------- */
.progress{background:var(--surface);border-radius:16px;padding:14px 16px;margin-bottom:14px;display:flex;align-items:center;gap:14px}
.progress .big{font-family:var(--display);font-weight:800;font-size:2rem;line-height:1}
.bar{flex:1;height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--moss),var(--heather))}
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:.85rem;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 10px}
.slotbtn{position:relative;border:0;padding:0;background:none;border-radius:6%}
.slot{width:100%;aspect-ratio:63/88;border-radius:6%;border:2px dashed var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--muted);font-family:var(--display);font-weight:700}
.slot .q{font-size:1.6rem}
.slot small{font-size:.72rem;font-family:var(--body);font-weight:400}
.qty{position:absolute;bottom:-6px;right:-4px;background:var(--ink);color:var(--bg);font-weight:700;font-size:.75rem;padding:1px 8px;border-radius:99px;z-index:4}
.empty{background:var(--surface);border-radius:16px;padding:22px;text-align:center}

/* ---------- Modal ---------- */
.modal{position:fixed;inset:0;z-index:40;background:rgba(10,16,13,.82);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:20px;
  padding-top:calc(20px + env(safe-area-inset-top,0px));padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
.modal p{color:#E6ECE2;margin:0}

/* ---------- Import ---------- */
.panel{background:var(--surface);border-radius:16px;padding:16px;margin-bottom:14px}
.panel h2{font-family:var(--display);font-weight:800;font-size:1.25rem;margin:0 0 4px}
.panel p{margin:0 0 12px;color:var(--muted);font-size:.92rem}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.field label{font-weight:700;font-size:.9rem}
.field input[type=text],textarea{background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:10px}
textarea{min-height:120px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.82rem;resize:vertical}
.check{display:flex;gap:8px;align-items:flex-start;font-size:.92rem;margin-bottom:12px}
.check input{margin-top:4px}
.status{font-size:.9rem;margin:10px 0 0;min-height:1.2em}
.status.err{color:#C0392B}
details{margin-top:6px}
summary{font-weight:700;cursor:pointer}
pre{background:var(--bg);border-radius:10px;padding:10px;overflow-x:auto;font-size:.78rem;line-height:1.45}
.setlist{list-style:none;margin:0;padding:0}
.setlist li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.setlist li:first-child{border-top:0}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:.9rem;z-index:50;max-width:90vw;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.on{opacity:1}
.loading{text-align:center;color:var(--muted);padding:80px 0}


/* ---------- Motion & effects ---------- */

.reveal .lift{position:relative;z-index:11;transition:color .4s}
body.dim .reveal .lift{color:#F3F5EE}
body.dim .reveal .btn.ghost{color:#F3F5EE;border-color:rgba(255,255,255,.35)}
#dimmer{position:fixed;inset:0;z-index:10;pointer-events:none;opacity:0;transition:opacity .5s;
  background:radial-gradient(circle at 50% 45%,rgba(14,10,24,.45),rgba(14,10,24,.9))}
body.dim #dimmer{opacity:1}
.dots{display:flex;gap:7px;justify-content:center}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line);transition:transform .3s,background .3s}
.dots i.done{background:var(--muted)}
.dots i.cur{background:var(--heather);transform:scale(1.35)}
.cardwrap{position:relative;z-index:11;display:flex;align-items:center;justify-content:center}
.stagebtn{position:relative;z-index:2;touch-action:none;user-select:none;-webkit-user-select:none}
.deal{animation:deal .5s cubic-bezier(.2,.8,.3,1.15) backwards}
@keyframes deal{from{transform:translateY(70px) scale(.86) rotate(-5deg);opacity:0}}
.flipper.shown{transform:none;transition:none}
.flipper.up{animation:flipup .7s cubic-bezier(.3,.7,.3,1) forwards}
@keyframes flipup{0%{transform:rotateY(180deg)}50%{transform:rotateY(90deg) scale(1.12) translateY(-16px)}100%{transform:rotateY(0deg) scale(1)}}
.flipper.charge{animation:charge .65s ease-in-out}
@keyframes charge{0%,100%{transform:rotateY(180deg)}20%{transform:rotateY(180deg) rotate(-3deg) scale(1.03)}40%{transform:rotateY(180deg) rotate(3deg) scale(1.05)}60%{transform:rotateY(180deg) rotate(-4deg) scale(1.07)}80%{transform:rotateY(180deg) rotate(4deg) scale(1.08)}}

.fx{position:absolute;left:50%;top:50%;width:175%;aspect-ratio:1;border-radius:50%;pointer-events:none;z-index:1;opacity:0;
  transform:translate(-50%,-50%) scale(.4);transition:opacity .5s,transform .8s cubic-bezier(.2,.8,.3,1)}
.fx.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
.fx::before{content:"";position:absolute;inset:0;border-radius:50%;
  background:repeating-conic-gradient(var(--ray) 0deg 6deg,transparent 6deg 18deg);
  -webkit-mask:radial-gradient(circle,#000 18%,transparent 68%);mask:radial-gradient(circle,#000 18%,transparent 68%);
  animation:spin 16s linear infinite}
.fx::after{content:"";position:absolute;inset:16%;border-radius:50%;background:radial-gradient(circle,var(--glow),transparent 70%)}
.fx-rare{--ray:rgba(240,180,67,.55);--glow:rgba(255,214,120,.65)}
.fx-holo{--ray:rgba(201,149,255,.55);--glow:rgba(122,211,255,.7)}
.fx-ultra{--glow:rgba(255,200,240,.85)}
.fx-ultra::before{animation-duration:9s;background:repeating-conic-gradient(#ff7a7a 0deg 5deg,transparent 5deg 12deg,#ffd36b 12deg 17deg,transparent 17deg 24deg,#8cf5a8 24deg 29deg,transparent 29deg 36deg,#7ad3ff 36deg 41deg,transparent 41deg 48deg,#c995ff 48deg 53deg,transparent 53deg 60deg)}
@keyframes spin{to{transform:rotate(360deg)}}
.p{position:absolute;left:50%;top:50%;width:var(--s);height:var(--s);border-radius:50%;background:var(--c);box-shadow:0 0 10px var(--c);
  z-index:3;pointer-events:none;animation:burst var(--t,1s) cubic-bezier(.1,.75,.3,1) forwards}
.p.star{border-radius:0;box-shadow:none;clip-path:polygon(50% 0,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0 50%,39% 39%)}
@keyframes burst{from{transform:translate(-50%,-50%) scale(.3);opacity:1}to{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1) rotate(180deg);opacity:0}}
.flash{position:fixed;inset:0;background:#fff;z-index:60;pointer-events:none;animation:flash .7s ease-out forwards}
@keyframes flash{from{opacity:.9}to{opacity:0}}

.card.tilt .face{box-shadow:0 1px 0 rgba(255,255,255,.4) inset,calc(var(--ry) * -1.2) calc(12px + var(--rx) * 1.2) 30px rgba(20,30,25,.35)}

.summary-title{font-family:var(--display);font-weight:800;font-size:1.4rem;margin:0;text-align:center}
.pulls .cell{animation:fanIn .55s cubic-bezier(.2,.8,.3,1.2) backwards;animation-delay:calc(var(--i) * 90ms)}
@keyframes fanIn{from{transform:translateY(40px) rotate(-8deg) scale(.85);opacity:0}}
.pulls .cell.best{grid-column:1 / -1;width:58%;justify-self:center;margin-bottom:6px}
.modal{animation:fade .25s ease-out}
.modal>div{animation:pop .4s cubic-bezier(.2,.8,.3,1.25)}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{transform:scale(.8) translateY(20px);opacity:0}}
.progress .bar i{transition:width .8s cubic-bezier(.2,.8,.3,1)}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}

/* ================= Modern layer ================= */
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
body{background:
  radial-gradient(90% 46% at 50% -6%,color-mix(in srgb,var(--heather) 26%,transparent),transparent 72%),
  radial-gradient(60% 40% at 105% 32%,color-mix(in srgb,var(--moss) 16%,transparent),transparent 70%),
  var(--bg);background-attachment:fixed;font-weight:450}
.app{padding:12px 16px 132px}
header.top{margin-bottom:16px}
.logo{display:flex;align-items:center;gap:10px}
.logo .mark{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;flex:none;
  background:linear-gradient(145deg,var(--heather),var(--moss));
  box-shadow:0 6px 18px color-mix(in srgb,var(--heather) 38%,transparent),inset 0 1px 0 rgba(255,255,255,.4)}
.brand{font-size:1.3rem;letter-spacing:-.035em;font-weight:800}
.brand span{color:var(--muted);font-weight:500}
.setpick{display:block}
select{appearance:none;-webkit-appearance:none;max-width:168px;padding:9px 34px 9px 14px;border-radius:999px;font-weight:600;font-size:.88rem;
  border:1px solid var(--line);background:var(--surface) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path d='M1 1.5 6 6.5 11 1.5' fill='none' stroke='%239a94a8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/></svg>") no-repeat right 13px center}

nav.tabs{left:50%;right:auto;transform:translateX(-50%);width:min(92vw,400px);bottom:calc(10px + env(safe-area-inset-bottom,0px));
  padding:6px;gap:4px;border:1px solid var(--line);border-radius:26px;
  background:color-mix(in srgb,var(--surface) 78%,transparent);
  -webkit-backdrop-filter:blur(20px) saturate(1.5);backdrop-filter:blur(20px) saturate(1.5);
  box-shadow:0 14px 40px rgba(8,4,18,.32)}
nav.tabs button{max-width:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 4px 8px;border-radius:20px;
  font-size:.72rem;font-weight:650;color:var(--muted);transition:background .25s,color .25s}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{background:color-mix(in srgb,var(--heather) 22%,transparent);color:var(--heather)}
.toast{bottom:calc(92px + env(safe-area-inset-bottom,0px));border-radius:16px;font-weight:600}

.btn{padding:13px 24px;font-weight:700;letter-spacing:-.005em;
  box-shadow:0 8px 22px color-mix(in srgb,var(--heather) 36%,transparent),inset 0 1px 0 rgba(255,255,255,.3);
  transition:transform .15s,box-shadow .2s,opacity .2s}
.btn:active{transform:scale(.96)}
.btn.ghost{background:color-mix(in srgb,var(--surface) 72%,transparent);border:1px solid var(--line);box-shadow:none;color:var(--ink)}
.btn.small{padding:9px 16px}
.filebtn{cursor:pointer;display:inline-block}
.filebtn:focus-within{outline:3px solid var(--heather);outline-offset:3px}

/* open */
.stage.home::before{content:"";position:absolute;left:50%;top:44%;width:360px;height:360px;transform:translate(-50%,-50%);z-index:-1;pointer-events:none;
  background:radial-gradient(circle,color-mix(in srgb,var(--heather) 38%,transparent),transparent 66%);filter:blur(8px)}
.stats{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.stat{background:color-mix(in srgb,var(--surface) 80%,transparent);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:.85rem;color:var(--muted)}
.stat b{color:var(--ink);font-family:var(--display);font-weight:700;margin-right:3px}
.hint{font-size:.92rem}
.count{font-size:.85rem}
.dots i{width:7px;height:7px}
.summary-title{letter-spacing:-.03em}

/* cards */
.card .nm{font-size:7.3cqw;letter-spacing:-.02em}
.card .hp{font-size:5cqw}
.card .hp b{font-size:6.6cqw}
.card .back{background:#2b1f3d;border:0;display:block}
.card .back img,.card .back svg{width:100%;height:100%;display:block;object-fit:cover}

/* binder */
.progress{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:16px 18px;margin-bottom:12px}
.ring{position:relative;width:84px;height:84px}
.ring svg{transform:rotate(-90deg);display:block}
.ring circle:last-child{transition:stroke-dasharray .9s cubic-bezier(.2,.8,.3,1)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:1.05rem;font-weight:700}
.pinfo .big{font-family:var(--display);font-weight:800;font-size:1.9rem;line-height:1;letter-spacing:-.04em}
.pinfo .big small{font-size:1rem;color:var(--muted);font-weight:600}
.rar{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:10px;font-size:.78rem;color:var(--muted);font-weight:600}
.rar span{display:inline-flex;align-items:center;gap:5px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;background:#9AA79C}
.dot.uncommon{background:#7FA889}.dot.rare{background:#C9A55A}.dot.holo{background:linear-gradient(135deg,#7ad3ff,#c995ff)}.dot.ultra{background:linear-gradient(135deg,#ff7a7a,#ffd36b,#8cf5a8)}
.filters{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;margin:0 -16px 10px;padding:8px 16px;
  background:color-mix(in srgb,var(--bg) 78%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:650;font-size:.82rem;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.slot{background:color-mix(in srgb,var(--surface) 60%,transparent);border:1.5px dashed var(--line);border-radius:7%}
.qty{background:var(--surface);color:var(--ink);border:1px solid var(--line);font-family:var(--display)}
.empty{background:var(--surface);border:1px solid var(--line);border-radius:22px}

/* 3D card viewer */
.viewer3d{gap:12px;overflow:hidden}
.stage3d{position:relative;width:min(94vw,440px);height:min(62vh,560px);display:grid;place-items:center;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.stage3d:active{cursor:grabbing}
.stage3d::after{content:"";position:absolute;left:20%;right:20%;bottom:1%;height:18px;border-radius:50%;background:radial-gradient(ellipse,rgba(0,0,0,.55),transparent 70%);filter:blur(7px);z-index:0}
.rot{--cw:min(70vw,300px);position:relative;z-index:1;width:var(--cw);aspect-ratio:63/88;transform-style:preserve-3d;will-change:transform}
.rot .side{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:4.5% / 3.2%}
.rot .side.back{transform:rotateY(180deg);overflow:hidden;background:#2b1f3d;box-shadow:0 14px 34px rgba(0,0,0,.5)}
.rot .side.back img,.rot .side.back svg{width:100%;height:100%;display:block;object-fit:cover}
.rot .card{--w:100%;width:100%;transform-style:flat}
.sheen3d{position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:7;background:radial-gradient(circle at var(--gx,50%) var(--gy,28%),rgba(255,255,255,var(--ga,.2)),transparent 55%)}
.vhint{max-width:90vw;text-align:center;font-size:.88rem;color:#C9C3D8!important}
.vrow{position:relative;z-index:5}
.vrow .btn{color:#F1EEF8;border-color:rgba(255,255,255,.25)}

/* prices */
.slotbtn .ptag{position:absolute;left:5px;bottom:5px;z-index:8;font:700 .68rem var(--display);letter-spacing:-.01em;background:rgba(16,12,24,.86);color:#FFE9A6;padding:2px 8px;border-radius:99px;pointer-events:none;box-shadow:0 2px 6px rgba(0,0,0,.35)}
.pulls .cell:not(.best) .ptag{font-size:.58rem;padding:1px 6px;left:3px;bottom:3px}
.vval{margin:0;font-size:1.02rem;color:#FFE9A6!important;text-align:center}
.vval b{font-family:var(--display);font-size:1.25rem;letter-spacing:-.02em}
.vval.dim{font-size:.88rem;color:#B9B2C9!important}
.rar b{color:var(--ink);font-family:var(--display)}

/* collection views */
.scope{display:flex;gap:8px;margin-bottom:12px}
.scope .chip{flex:1;text-align:center;padding:10px 6px}
.packrow{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:14px 14px 12px;margin-bottom:12px}
.phead{display:flex;justify-content:space-between;align-items:baseline;gap:4px 10px;flex-wrap:wrap;margin-bottom:10px}
.phead b{font-family:var(--display);letter-spacing:-.02em}
.phead span{color:var(--muted);font-size:.8rem}
.packcards{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 8px;scroll-snap-type:x proximity;scrollbar-width:none}
.packcards::-webkit-scrollbar{display:none}
.packcards .slotbtn{flex:0 0 28%;scroll-snap-align:start}

/* big sets: keep the grid light */
.grid .slotbtn,.grid .slot{content-visibility:auto;contain-intrinsic-width:0px;contain-intrinsic-height:auto 190px}
.grid .card .foil i,.grid .card.ultra .face{animation:none}

/* never let long text widen the page */
html,body{overflow-x:clip}
.app,.panel,#view{min-width:0}
.panel,.setlist,.empty{overflow-wrap:anywhere}
.setlist li{align-items:center}
.setlist .sname{flex:1;min-width:0;overflow-wrap:anywhere}
.setlist .sbtns{display:flex;gap:6px;flex:none}
select{text-overflow:ellipsis}

/* library */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:18px;margin-bottom:14px}
.panel h2{font-size:1.1rem;letter-spacing:-.025em}
.field input[type=text],.field input[type=password],textarea{background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:12px 14px;width:100%}
.field input:focus,textarea:focus{outline:2px solid var(--heather);outline-offset:1px}
.field input[type=file]{font-size:.9rem;color:var(--muted)}
.check{align-items:center}
.backrow{display:flex;gap:18px;align-items:center;margin-bottom:14px}
.backprev{width:98px;aspect-ratio:63/88;border-radius:10px;overflow:hidden;flex:none;border:1px solid var(--line);box-shadow:0 12px 28px rgba(8,4,18,.35)}
.backprev img,.backprev svg{width:100%;height:100%;display:block;object-fit:cover}
.backctl{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
summary{padding:4px 0}
pre{background:var(--surface2);border:1px solid var(--line)}
.setlist li{border-color:var(--line)}
.modal{-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
/* reduced effects: older phones and battery saving */
body.lite .pack:not(.nudge),body.lite .packglare,body.lite .rays,body.lite .foil i,body.lite .card.scan .face,body.lite .card.ultra .face,body.lite .fx::before,body.lite .dots i{animation:none!important}
body.lite nav.tabs{-webkit-backdrop-filter:none;backdrop-filter:none;background:var(--surface)}
body.lite .filters{-webkit-backdrop-filter:none;backdrop-filter:none;background:var(--bg)}
body.lite .modal,body.lite .chips span{-webkit-backdrop-filter:none;backdrop-filter:none}
body.lite .stage.home::before{filter:none}
body.lite .pack{filter:drop-shadow(0 14px 14px rgba(8,4,18,.45))}
/* iPhone: stop Safari zooming the page when a field is tapped */
@supports (-webkit-touch-callout:none){input,textarea,select{font-size:16px!important}}
/* achievements */
.sect{font-family:var(--display);font-size:.95rem;letter-spacing:-.02em;margin:18px 2px 8px;color:var(--muted)}
.awards{display:grid;gap:10px}
.award{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 14px}
.award:not(.got){opacity:.92}
.aicon{flex:none;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--surface2);color:var(--muted)}
.aicon svg{width:22px;height:22px;fill:currentColor}
.aicon.on{background:linear-gradient(145deg,#FFE9A6,#E2A92B);color:#4A3000;box-shadow:0 4px 12px rgba(226,169,43,.35)}
.abody{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.abody b{font-family:var(--display);font-size:.95rem;letter-spacing:-.02em}
.abody span{font-size:.84rem;color:var(--muted)}
.abody small{font-size:.76rem;color:var(--muted)}
.abar{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin:5px 0 2px}
.abar i{display:block;height:100%;background:linear-gradient(90deg,var(--moss),var(--heather))}
.achpop{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:70;display:flex;gap:12px;align-items:center;max-width:92vw;padding:10px 18px 10px 10px;border-radius:99px;background:#1B1724;color:#F1EEF8;border:1px solid rgba(242,194,75,.5);box-shadow:0 12px 34px rgba(0,0,0,.5);animation:achin .45s cubic-bezier(.2,.8,.3,1.2)}
.achpop.out{opacity:0;transform:translate(-50%,-14px);transition:opacity .3s,transform .3s}
.achpop small{display:block;font-size:.7rem;color:#F2C24B;letter-spacing:.02em;white-space:nowrap}
.achpop b{font-family:var(--display);font-size:.95rem;letter-spacing:-.02em}
@keyframes achin{from{opacity:0;transform:translate(-50%,-26px) scale(.9)}}
.scope .chip{font-size:.78rem;padding:10px 2px}
/* in-hand tag and scanner */
.slotbtn .hand{position:absolute;right:4px;top:4px;z-index:8;font:700 .56rem var(--display);letter-spacing:.02em;background:#F2C24B;color:#3A2600;padding:2px 7px;border-radius:99px;pointer-events:none;box-shadow:0 2px 6px rgba(0,0,0,.35)}
.scanner{justify-content:flex-start;overflow-y:auto;gap:12px}
.scanbox{position:relative;flex:none;width:min(80vw,320px);aspect-ratio:3/4;border-radius:18px;overflow:hidden;background:#000}
.scanbox video{width:100%;height:100%;object-fit:cover;display:block}
.scanframe{position:absolute;inset:7% 9%;border:2px solid rgba(255,255,255,.9);border-radius:10px;box-shadow:0 0 0 999px rgba(0,0,0,.42)}
.scanmsg{max-width:90vw;text-align:center;font-size:.92rem}
.scanq{width:min(92vw,420px);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.scanres{width:min(92vw,420px);display:grid;gap:8px;padding-bottom:30px}
.srow{display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:8px}
.sthumb{flex:none;width:58px}
.sinfo{flex:1;min-width:0;display:flex;flex-direction:column;overflow-wrap:anywhere}
.sinfo b{font-family:var(--display);font-size:.9rem;letter-spacing:-.02em}
.sinfo span,.sinfo small{font-size:.78rem;color:var(--muted)}
.sact{display:flex;flex-direction:column;gap:6px;flex:none}
/* cards stacked behind the one you swipe */
.cardwrap{--cw:min(72vw,290px)}
.cardwrap .ghost{position:absolute;left:50%;top:50%;width:var(--cw);aspect-ratio:63/88;border-radius:4.5% / 3.2%;overflow:hidden;z-index:0;pointer-events:none;box-shadow:0 10px 24px rgba(0,0,0,.4);transform:translate(-50%,calc(-50% + var(--n) * 19px)) scale(calc(1 - var(--n) * .06));opacity:calc(1 - var(--n) * .18)}
.cardwrap .ghost.g1{--n:1}.cardwrap .ghost.g2{--n:2}
.cardwrap .ghost img,.cardwrap .ghost svg{width:100%;height:100%;display:block;object-fit:cover}
/* random pack + trading */
.packmode{width:min(92vw,360px);margin:0}
.trade{justify-content:flex-start;overflow-y:auto;padding-top:calc(20px + env(safe-area-inset-top,0px))}
.tbox{width:min(92vw,460px);background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:22px;padding:18px;margin-bottom:30px}
.tbox h2{font-family:var(--display);font-size:1.25rem;letter-spacing:-.03em;margin:0 0 8px}
.tbox p{color:var(--muted)!important;font-size:.92rem;margin:0 0 12px}
.tbox .sect{margin:14px 2px 8px}
.codebox{width:100%;margin:6px 0 10px;background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:10px 12px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.74rem;color:var(--ink);word-break:break-all;resize:none;min-height:0}
.tlist{display:grid;gap:8px}
.trow{display:flex;gap:10px;align-items:center;background:var(--surface2);border:1px solid var(--line);border-radius:16px;padding:8px}
.tq{font-family:var(--display);font-weight:700;flex:none}
.tlog{font-size:.84rem;margin:0 0 6px!important}
.tstat{margin:12px 0!important}
#tnote.err{color:#C0392B!important}

<script>
(() => {
"use strict";

/* ================= Utilities ================= */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const slug = s => String(s ?? "").toLowerCase().normalize("NFKD").replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 60);
function hash(str){ let h = 2166136261; for (const ch of str){ h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
function rng(seed){ return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function shade(hex, amt){ const n = parseInt(hex.slice(1), 16); let r = n >> 16, g = n >> 8 & 255, b = n & 255;
  const f = v => Math.max(0, Math.min(255, Math.round(amt < 0 ? v * (1 + amt) : v + (255 - v) * amt)));
  return "#" + [f(r), f(g), f(b)].map(v => v.toString(16).padStart(2, "0")).join(""); }
const buzz = p => { try { navigator.vibrate && navigator.vibrate(p); } catch {} };
const reduceMotion = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
let toastT;
function toast(msg){ const t = $("#toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("on"), 3200); }

/* ================= Data: original set ================= */
const TYPES = {
  ember:{label:"Ember", a:"#E2583E", b:"#F6B26B", bg1:"#FDE3C6", bg2:"#F08A5D", moves:["Cinder Toss","Hearth Rush","Kindle Swipe"]},
  tide: {label:"Tide",  a:"#2F7FB8", b:"#8FD0EE", bg1:"#D3EDF8", bg2:"#5FA8D3", moves:["Brine Splash","Undertow","Ripple Slap"]},
  bloom:{label:"Bloom", a:"#4E9A52", b:"#B3DB7A", bg1:"#E3F3CF", bg2:"#7DBF6B", moves:["Seed Volley","Thorn Hug","Pollen Puff"]},
  spark:{label:"Spark", a:"#D9A514", b:"#FFE48A", bg1:"#FFF4CC", bg2:"#EFC53F", moves:["Static Hop","Bolt Nip","Fizz Burst"]},
  stone:{label:"Stone", a:"#8A6A4F", b:"#CDB08F", bg1:"#EDE2D3", bg2:"#B08E6B", moves:["Pebble Pelt","Rockslide","Grit Grind"]},
  gloom:{label:"Gloom", a:"#6B3F8C", b:"#B892D4", bg1:"#E7DAF1", bg2:"#8E63B0", moves:["Dusk Veil","Murk Bite","Night Hush"]},
  frost:{label:"Frost", a:"#4A97A6", b:"#D2F1F5", bg1:"#ECF9FB", bg2:"#9AD6DE", moves:["Rime Breath","Sleet Spin","Chill Nudge"]},
  gale: {label:"Gale",  a:"#6F8DAE", b:"#E2EBF5", bg1:"#F1F5FA", bg2:"#AFC3DA", moves:["Gust Flap","Updraft","Whirl Peck"]}
};
const RARITY = {
  common:  {label:"Common",     sym:"●", rank:0},
  uncommon:{label:"Uncommon",   sym:"◆", rank:1},
  rare:    {label:"Rare",       sym:"★", rank:2},
  holo:    {label:"Holo rare",  sym:"★", rank:3},
  ultra:   {label:"Ultra rare", sym:"✦", rank:4}
};
const RANKS = ["common","uncommon","rare","holo","ultra"];

const NAMES = {
  ember:["Cindrel","Scorchet","Embadger","Pyrrhoot"],
  tide:["Splashkin","Drizzlop","Tidewhisk","Brinemaw"],
  bloom:["Sproutle","Mossling","Thistlow","Fernabble"],
  spark:["Zapplet","Voltwick","Fizzmoth","Sparkrook"],
  stone:["Pebblot","Cragnut","Grumblerock","Shalecub"],
  gloom:["Duskmop","Gloamquill","Murkit","Shadeling"],
  frost:["Frostnip","Rimeling","Glaciow","Snowmuff"],
  gale:["Breezle","Gustowl","Zephyrun","Skyflick"]
};
// rarity per position across types (32 total: 12 C, 9 U, 6 R, 3 H, 2 U+)
const RPLAN = {
  ember:["common","common","uncommon","holo"], tide:["common","common","uncommon","rare"],
  bloom:["common","uncommon","uncommon","rare"], spark:["common","uncommon","rare","ultra"],
  stone:["common","common","uncommon","rare"], gloom:["common","uncommon","rare","holo"],
  frost:["common","common","uncommon","ultra"], gale:["common","uncommon","rare","holo"]
};
function buildWildmoor(){
  const cards = []; let n = 1;
  for (const t of Object.keys(TYPES)){
    NAMES[t].forEach((nm, i) => {
      const r = rng(hash(nm)); const rar = RPLAN[t][i];
      const hp = 40 + RANKS.indexOf(rar) * 20 + Math.floor(r() * 3) * 10;
      cards.push({id:"w" + String(n).padStart(2,"0"), no:n, name:nm, type:t, rarity:rar, hp,
        move:TYPES[t].moves[Math.floor(r() * 3)], dmg:10 * (2 + RANKS.indexOf(rar) * 2 + Math.floor(r() * 3))});
      n++;
    });
  }
  return {id:"wildmoor", name:"Wildmoor", builtIn:true, cards};
}
const WILDMOOR = buildWildmoor();

/* ================= Creature art (procedural, original) ================= */
const svgCache = new Map();
function creatureSVG(card, opts = {}){
  const key = card.id + (opts.full ? "f" : "");
  if (svgCache.has(key)) return svgCache.get(key);
  const T = TYPES[card.type]; const R = rng(hash(card.name + card.id));
  const dark = shade(T.a, -.35), light = T.b;
  const cx = 100, by = 92 + (opts.full ? 6 : 0);
  const brx = 34 + R() * 16, bry = 28 + R() * 13;
  const hasHead = R() < .45;
  const headR = 20 + R() * 8;
  const hx = cx + (R() - .5) * 18, hy = by - bry * .85;
  const topX = hasHead ? hx : cx, topY = hasHead ? hy - headR + 2 : by - bry + 2;
  const fx = hasHead ? hx : cx, fy = hasHead ? hy + 2 : by - bry * .3;
  const fw = hasHead ? headR * .46 : brx * .36;
  const eyeStyle = Math.floor(R() * 3), mouth = Math.floor(R() * 3);
  const ears = R() < .45 && card.type !== "spark", tail = R() < .6, blush = R() < .5;
  const st = `stroke="${dark}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"`;
  const back = [], front = [], top = [];

  // background
  const bgid = "g" + key;
  let bg = `<defs><radialGradient id="${bgid}" cx="50%" cy="38%" r="75%"><stop offset="0" stop-color="${T.bg1}"/><stop offset="1" stop-color="${T.bg2}"/></radialGradient></defs>
    <rect width="200" height="150" fill="url(#${bgid})"/>`;
  if (opts.full){
    for (let i = 0; i < 12; i++){ const a = i * 30 + R() * 8; bg += `<path d="M100 80 L${100 + 220 * Math.cos(a * Math.PI / 180)} ${80 + 220 * Math.sin(a * Math.PI / 180)} L${100 + 220 * Math.cos((a + 11) * Math.PI / 180)} ${80 + 220 * Math.sin((a + 11) * Math.PI / 180)}Z" fill="#fff" opacity=".18"/>`; }
  } else {
    for (let i = 0; i < 4; i++) bg += `<circle cx="${20 + R() * 160}" cy="${12 + R() * 50}" r="${6 + R() * 16}" fill="#fff" opacity=".22"/>`;
  }
  bg += `<ellipse cx="100" cy="${by + bry + 6}" rx="${brx + 14}" ry="8" fill="${dark}" opacity=".18"/>`;

  // tail
  if (tail){
    back.push(`<path d="M${cx + brx * .75} ${by + bry * .35} Q${cx + brx * 1.55} ${by + bry * .3} ${cx + brx * 1.35} ${by - bry * .55}" fill="none" stroke="${dark}" stroke-width="13" stroke-linecap="round"/>
      <path d="M${cx + brx * .75} ${by + bry * .35} Q${cx + brx * 1.55} ${by + bry * .3} ${cx + brx * 1.35} ${by - bry * .55}" fill="none" stroke="${T.a}" stroke-width="8" stroke-linecap="round"/>`);
    if (card.type === "ember") back.push(`<path d="M${cx + brx * 1.35 - 8} ${by - bry * .5} Q${cx + brx * 1.35 - 6} ${by - bry * .5 - 20} ${cx + brx * 1.35 + 2} ${by - bry * .5 - 26} Q${cx + brx * 1.35 + 4} ${by - bry * .5 - 12} ${cx + brx * 1.35 + 10} ${by - bry * .5 - 14} Q${cx + brx * 1.35 + 12} ${by - bry * .5} ${cx + brx * 1.35 + 4} ${by - bry * .5 + 4}Z" fill="#F6C343" ${st}/>`);
  }
  // type back parts
  switch (card.type){
    case "tide": back.push(`<path d="M${cx + brx * .1} ${by - bry * .9} Q${cx + brx * .7} ${by - bry * 1.7} ${cx + brx * .95} ${by - bry * .25}Z" fill="${light}" ${st}/>`); break;
    case "stone": for (let i = 0; i < 3; i++){ const x = cx - brx * .5 + i * brx * .5, y = by - bry * .82 + Math.abs(i - 1) * 6; back.push(`<path d="M${x - 9} ${y + 8} L${x - 2} ${y - 16 - R() * 8} L${x + 9} ${y + 8}Z" fill="${light}" ${st}/>`); } break;
    case "gale": back.push(`<ellipse cx="${cx - brx * .95}" cy="${by - bry * .2}" rx="${22}" ry="${12}" transform="rotate(-30 ${cx - brx * .95} ${by - bry * .2})" fill="${light}" ${st}/>
      <ellipse cx="${cx + brx * .95}" cy="${by - bry * .2}" rx="${22}" ry="${12}" transform="rotate(30 ${cx + brx * .95} ${by - bry * .2})" fill="${light}" ${st}/>`); break;
  }
  // feet + body + belly
  front.push(`<ellipse cx="${cx - brx * .45}" cy="${by + bry * .93}" rx="11" ry="6.5" fill="${dark}"/><ellipse cx="${cx + brx * .45}" cy="${by + bry * .93}" rx="11" ry="6.5" fill="${dark}"/>`);
  front.push(`<ellipse cx="${cx}" cy="${by}" rx="${brx}" ry="${bry}" fill="${T.a}" ${st}/>`);
  front.push(`<ellipse cx="${cx}" cy="${by + bry * .28}" rx="${brx * .58}" ry="${bry * .55}" fill="${light}" opacity=".9"/>`);
  if (hasHead){
    if (ears){ top.push(`<path d="M${hx - headR * .8} ${hy - headR * .2} L${hx - headR * .75} ${hy - headR * 1.35} L${hx - headR * .15} ${hy - headR * .85}Z" fill="${T.a}" ${st}/><path d="M${hx + headR * .8} ${hy - headR * .2} L${hx + headR * .75} ${hy - headR * 1.35} L${hx + headR * .15} ${hy - headR * .85}Z" fill="${T.a}" ${st}/>`); }
    top.push(`<circle cx="${hx}" cy="${hy}" r="${headR}" fill="${T.a}" ${st}/>`);
  } else if (ears){
    top.push(`<path d="M${cx - brx * .7} ${by - bry * .55} L${cx - brx * .65} ${by - bry * 1.3} L${cx - brx * .15} ${by - bry * .92}Z" fill="${T.a}" ${st}/><path d="M${cx + brx * .7} ${by - bry * .55} L${cx + brx * .65} ${by - bry * 1.3} L${cx + brx * .15} ${by - bry * .92}Z" fill="${T.a}" ${st}/>`);
    // re-draw body over ear bases
    top.push(`<ellipse cx="${cx}" cy="${by}" rx="${brx}" ry="${bry}" fill="${T.a}" ${st}/><ellipse cx="${cx}" cy="${by + bry * .28}" rx="${brx * .58}" ry="${bry * .55}" fill="${light}" opacity=".9"/>`);
  }
  // head-top type parts
  switch (card.type){
    case "ember": top.push(`<path d="M${topX - 12} ${topY + 6} Q${topX - 16} ${topY - 12} ${topX - 3} ${topY - 26} Q${topX - 2} ${topY - 12} ${topX + 5} ${topY - 17} Q${topX + 16} ${topY - 6} ${topX + 12} ${topY + 6}Z" fill="#F6C343" ${st}/>`); break;
    case "bloom": top.push(`<path d="M${topX} ${topY + 2} Q${topX - 20} ${topY - 6} ${topX - 22} ${topY - 22} Q${topX - 6} ${topY - 18} ${topX} ${topY + 2}Z" fill="${light}" ${st}/><path d="M${topX} ${topY + 2} Q${topX + 18} ${topY - 10} ${topX + 16} ${topY - 26} Q${topX + 2} ${topY - 18} ${topX} ${topY + 2}Z" fill="#7DBF6B" ${st}/>`); break;
    case "spark": [-1, 1].forEach(s => top.push(`<polyline points="${topX + s * 6},${topY + 4} ${topX + s * 12},${topY - 8} ${topX + s * 6},${topY - 14} ${topX + s * 14},${topY - 26}" fill="none" ${st}/><circle cx="${topX + s * 14}" cy="${topY - 28}" r="5" fill="${light}" ${st}/>`)); break;
    case "gloom": [-1, 1].forEach(s => top.push(`<path d="M${topX + s * 8} ${topY + 6} Q${topX + s * 22} ${topY - 10} ${topX + s * 12} ${topY - 22}" fill="none" stroke="${dark}" stroke-width="7" stroke-linecap="round"/><path d="M${topX + s * 8} ${topY + 6} Q${topX + s * 22} ${topY - 10} ${topX + s * 12} ${topY - 22}" fill="none" stroke="${light}" stroke-width="3" stroke-linecap="round"/>`)); break;
    case "frost": for (let i = -1; i <= 1; i++) top.push(`<path d="M${topX + i * 11 - 6} ${topY + 5} L${topX + i * 11} ${topY - 16 + Math.abs(i) * 6} L${topX + i * 11 + 6} ${topY + 5}Z" fill="#fff" ${st}/>`); break;
  }
  // face
  const ex1 = fx - fw, ex2 = fx + fw, ey = fy - 3;
  for (const ex of [ex1, ex2]){
    if (eyeStyle === 0) top.push(`<circle cx="${ex}" cy="${ey}" r="6.5" fill="#fff" stroke="${dark}" stroke-width="2"/><circle cx="${ex + 1}" cy="${ey + 1}" r="3.6" fill="#1E2A23"/><circle cx="${ex + 2.2}" cy="${ey - .4}" r="1.2" fill="#fff"/>`);
    else if (eyeStyle === 1) top.push(`<path d="M${ex - 5} ${ey} Q${ex} ${ey + 5} ${ex + 5} ${ey}" fill="none" stroke="#1E2A23" stroke-width="2.6" stroke-linecap="round"/>`);
    else top.push(`<ellipse cx="${ex}" cy="${ey}" rx="4.6" ry="6.4" fill="#1E2A23"/><circle cx="${ex + 1.6}" cy="${ey - 2.2}" r="1.7" fill="#fff"/>`);
  }
  if (blush && card.type !== "spark") top.push(`<ellipse cx="${ex1 - 4}" cy="${ey + 8}" rx="5" ry="3" fill="#FF8FA3" opacity=".45"/><ellipse cx="${ex2 + 4}" cy="${ey + 8}" rx="5" ry="3" fill="#FF8FA3" opacity=".45"/>`);
  const my = ey + 10;
  if (mouth === 0) top.push(`<path d="M${fx - 5} ${my} Q${fx} ${my + 5} ${fx + 5} ${my}" fill="none" stroke="#1E2A23" stroke-width="2.4" stroke-linecap="round"/>`);
  else if (mouth === 1) top.push(`<path d="M${fx - 6} ${my} Q${fx - 3} ${my + 4} ${fx} ${my} Q${fx + 3} ${my + 4} ${fx + 6} ${my}" fill="none" stroke="#1E2A23" stroke-width="2.2" stroke-linecap="round"/>`);
  else top.push(`<ellipse cx="${fx}" cy="${my + 1}" rx="4" ry="3.2" fill="#5A2230"/><path d="M${fx + 1} ${my - 1.5} l2 3.5 l1.5 -3.5z" fill="#fff"/>`);
  // extras
  if (card.type === "tide") for (let i = 0; i < 3; i++) top.push(`<circle cx="${30 + R() * 30}" cy="${30 + R() * 60}" r="${3 + R() * 5}" fill="none" stroke="#fff" stroke-width="2" opacity=".8"/>`);
  if (card.type === "frost") for (let i = 0; i < 5; i++) top.push(`<circle cx="${15 + R() * 170}" cy="${10 + R() * 70}" r="${1.5 + R() * 2}" fill="#fff"/>`);

  const svg = `<svg viewBox="0 0 200 150" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${esc(card.name)}">${bg}${back.join("")}${front.join("")}${top.join("")}</svg>`;
  svgCache.set(key, svg);
  return svg;
}

/* ================= Card rendering ================= */
const FRAMES = {common:"#9AA79C", uncommon:"#7FA889", rare:"#C9A55A", holo:"#B9C4CF"};
/* ---------- Reduced effects ---------- */
const isLite = () => state.lite === true || (state.lite == null && ((navigator.deviceMemory && navigator.deviceMemory <= 2) || (navigator.hardwareConcurrency && navigator.hardwareConcurrency <= 2)));
const applyLite = () => document.body.classList.toggle("lite", isLite());

/* ---------- Network errors ---------- */
function netError(host){
  const inClaude = /claude\.(ai|com)$|claudeusercontent|artifact/i.test(location.hostname);
  return inClaude ? "This view blocks outside websites. Open wildmoor.html in a normal browser like Chrome."
    : `Couldn\u2019t reach ${host || "that site"}. It may be down, busy, or not allow requests from web pages. Try again in a minute, or pick a different source.`;
}
const hostOf = u => { try { return new URL(u).host; } catch { return ""; } };

/* ---------- Card prices ---------- */
const TCGDEX_URL = "https://api.tcgdex.net/v2/en/cards/{id}", PTCG_URL = "https://api.pokemontcg.io/v2/cards?q=set.id:{set}&pageSize=250&select=id,tcgplayer,cardmarket";
const CUR = {USD:"$", EUR:"\u20ac", GBP:"\u00a3", AUD:"A$", CAD:"C$", NZD:"NZ$", JPY:"\u00a5", ZAR:"R", CHF:"CHF ", SEK:"kr ", NOK:"kr ", DKK:"kr ", PLN:"z\u0142 ", CZK:"K\u010d ", HUF:"Ft ", RON:"lei ", BGN:"lv ", TRY:"\u20ba", BRL:"R$", MXN:"MX$", INR:"\u20b9", CNY:"CN\u00a5", HKD:"HK$", SGD:"S$", KRW:"\u20a9", IDR:"Rp ", MYR:"RM ", PHP:"\u20b1", THB:"\u0e3f", ILS:"\u20aa", ISK:"kr "};
const CURNAMES = {USD:"US dollar", EUR:"Euro", GBP:"British pound", ZAR:"South African rand", AUD:"Australian dollar", CAD:"Canadian dollar", NZD:"New Zealand dollar", JPY:"Japanese yen", CHF:"Swiss franc", SEK:"Swedish krona", NOK:"Norwegian krone", DKK:"Danish krone", PLN:"Polish zloty", CZK:"Czech koruna", HUF:"Hungarian forint", RON:"Romanian leu", BGN:"Bulgarian lev", TRY:"Turkish lira", BRL:"Brazilian real", MXN:"Mexican peso", INR:"Indian rupee", CNY:"Chinese yuan", HKD:"Hong Kong dollar", SGD:"Singapore dollar", KRW:"South Korean won", IDR:"Indonesian rupiah", MYR:"Malaysian ringgit", PHP:"Philippine peso", THB:"Thai baht", ILS:"Israeli shekel", ISK:"Icelandic krona"};
const ZERO_DEC = new Set(["JPY", "KRW", "IDR", "HUF", "ISK"]);
/* units of a currency per 1 US dollar: a rate you set by hand wins over the downloaded one */
const rateOf = c => c === "USD" ? 1 : ((state.manualRates && state.manualRates[c]) || (state.rates && state.rates.r && state.rates.r[c]) || 0);
const convertAmt = (v, from, to) => { const a = rateOf(from), b = rateOf(to); return a && b ? v / a * b : null; };
const toUSD = (v, cur) => (!cur || cur === "USD") ? v : convertAmt(v, cur, "USD");
function fmtMoney(v, cur){
  const sym = CUR[cur] || (cur ? cur + " " : "$"), z = ZERO_DEC.has(cur);
  return sym + (v >= 1000 || z ? Math.round(v).toLocaleString() : v.toFixed(2));
}
/* shows an amount in the currency you picked, when a rate is available */
const money = (v, cur) => {
  const from = cur || "USD", to = state.curShow;
  if (to && to !== from){ const x = convertAmt(v, from, to); if (x != null) return fmtMoney(x, to); }
  return fmtMoney(v, from);
};

/* ================= Import ================= */
function normalizeRarity(r){
  const s = String(r ?? "").toLowerCase();
  if (!s) return "common";
  if (/ultra|secret|hyper|special|illustration|mythic|legend|rainbow|gold/.test(s)) return "ultra";
  if (/holo|foil|shiny|double/.test(s)) return "holo";
  if (/uncommon/.test(s)) return "uncommon";
  if (/rare/.test(s)) return "rare";
  if (RANKS.includes(s)) return s;
  return "common";
}
const getPath = (o, p) => String(p).split(".").reduce((a, k) => a == null ? a : a[k], o);
const mapValDom = id => ($("#" + id)?.value || "").trim();
const mapVal = mapValDom;
function extractList(j){
  const lp = mapVal("mlist");
  if (lp){ const v = getPath(j, lp); return Array.isArray(v) ? v : []; }
  if (Array.isArray(j)) return j;
  for (const k of ["cards","data","items","results"]) if (Array.isArray(j?.[k])) return j[k];
  return [];
}
function niceName(n){
  const t = String(n || "").trim();
  if (!/^https?:\/\//i.test(t)) return t;
  try { const last = decodeURIComponent(new URL(t).pathname.split("/").filter(Boolean).pop() || ""); return last.replace(/\.json$/i, "") || "Imported set"; } catch { return "Imported set"; }
}

  v.querySelectorAll("[data-ps]").forEach(b => b.onclick = () => { if (b.dataset.ps === "tcgdex") $("#purl").value = TCGDEX_URL; else if (b.dataset.ps === "ptcg") $("#purl").value = PTCG_URL; else { $("#purl").value = ""; $("#purl").focus(); } markSrc(); });
  v.querySelectorAll("[data-ap]").forEach(b => b.onclick = () => {
    state.autoPrice = b.dataset.ap === "on"; persist();
    v.querySelectorAll("[data-ap]").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
  });
  v.querySelectorAll("[data-sp]").forEach(b => b.onclick = () => {
    state.showPrices = b.dataset.sp === "on"; persist();
    v.querySelectorAll("[data-sp]").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
  });
  const dall = $("#delall"); if (dall) dall.onclick = async () => {
    if (!confirm(`Delete all ${custom.length} imported sets and their cards from your binder?`)) return;
    for (const x of custom){ try { await store.deleteSet(x.id); } catch {} forgetSet(x.id); }
    sets = [WILDMOOR]; state.active = "wildmoor"; session = null; queued = null; persist(); render(); toast("Imported sets deleted.");
  };
  $("#ifetch").onclick = fetchApi;
  $("#ijson").addEventListener("input", () => { pulled = null; });
  if (pulled){ $("#ifetchbox").open = true; $("#fstatus").textContent = `${pulled.length} cards are loaded and ready to import. Name the set, then tap Import set.`; if (pulledName && !$("#iname").value) $("#iname").value = pulledName; }
  $("#ggen").onclick = generateBack;
  const mp = $("#motionperm"); if (mp) mp.onclick = async () => { try { const r = await DeviceOrientationEvent.requestPermission(); toast(r === "granted" ? "Motion tilt on." : "Motion tilt was not allowed."); } catch { toast("Couldn\u2019t turn on motion tilt."); } };
  const cu = $("#chkupd"); if (cu) cu.onclick = checkUpdate;
  v.querySelectorAll("[data-pvm]").forEach(b => b.onclick = () => {
    state.priceVariant = b.dataset.pvm; applyVariant(); persist();
    v.querySelectorAll("[data-pvm]").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
    toast(state.priceVariant === "first" ? "Using 1st Edition prices where there are any." : state.priceVariant === "high" ? "Using the highest price of any version." : "Using the standard price.");
  });
  const rs = $("#ratestat"), setRs = (t, bad) => { if (rs){ rs.textContent = t; rs.style.color = bad ? "#C0392B" : ""; } };
  $("#curpick").onchange = async e => {
    state.curShow = e.target.value; persist();
    if (state.curShow && !rateOf(state.curShow)){ setRs("Getting exchange rates\u2026"); try { await refreshRates(); render(); toast("Showing values in " + state.curShow + "."); } catch { setRs("Couldn\u2019t get exchange rates. Check your connection, or set a rate by hand below.", true); } }
    else { render(); toast(state.curShow ? "Showing values in " + state.curShow + "." : "Showing values as the source gives them."); }
  };
  $("#ratesbtn").onclick = async () => { setRs("Refreshing\u2026"); try { await refreshRates(); render(); toast("Exchange rates updated."); } catch { setRs("Couldn\u2019t get exchange rates. Check your connection.", true); } };
  $("#mrsave").onclick = () => { const c = $("#mrcur").value, v = parseFloat(String($("#mrval").value).replace(",", ".")), ms = $("#mrstat"); if (!(v > 0)){ ms.textContent = "Enter a number above zero."; ms.classList.add("err"); return; } state.manualRates = state.manualRates || {}; state.manualRates[c] = v; persist(); render(); toast(`1 USD = ${v} ${c}.`); };
  const mc = $("#mrclear"); if (mc) mc.onclick = () => { state.manualRates = {}; persist(); render(); toast("Your rates were cleared."); };
  $("#bkgo").onclick = makeBackup; $("#bkfile").onchange = restoreBackup;
  const pi = $("#pwainstall"); pi.hidden = !installEvt; pi.onclick = async () => { if (!installEvt) return; installEvt.prompt(); try { await installEvt.userChoice; } catch {} installEvt = null; pi.hidden = true; };
  $("#shareapp").onclick = () => shareText("Try Wildmoor Packs, a card pack opening app.");
  v.querySelectorAll("[data-lite]").forEach(b => b.onclick = () => {
    state.lite = b.dataset.lite === "auto" ? null : b.dataset.lite === "on"; applyLite(); persist();
    v.querySelectorAll("[data-lite]").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
    toast(state.lite === true ? "Effects reduced." : state.lite === false ? "Full effects." : "Effects set to auto.");
  });
  v.querySelectorAll("[data-q]").forEach(b => b.onclick = () => {
    state.imgQuality = b.dataset.q; persist(); queued = null;
    v.querySelectorAll("[data-q]").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
    toast(state.imgQuality === "fast" ? "Using smaller images." : "Using sharp images.");
  });
  v.querySelectorAll("[data-foil]").forEach(b => b.onclick = () => {
    state.noFoil = b.dataset.foil === "off"; document.body.classList.toggle("nofoil", state.noFoil); persist();
    v.querySelectorAll("[data-foil]").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
    toast(state.noFoil ? "Foil shimmer off." : "Foil shimmer on.");
  });
  v.querySelectorAll("[data-rs]").forEach(b => b.onclick = () => {
    state.faceDown = b.dataset.rs === "down"; persist(); session = null;
    v.querySelectorAll("[data-rs]").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
    toast(state.faceDown ? "Cards will start face down." : "Cards will start face up.");
  });
  $("#backfile").onchange = async e => { const f = e.target.files[0]; if (!f) return; try { state.back = await cropToCard(f); persist(); updateBackPreview(); toast("Card back updated."); } catch (err) { toast(err.message); } e.target.value = ""; };
  $("#backreset").onclick = () => { state.back = null; persist(); updateBackPreview(); toast("Default card back restored."); };
  v.querySelectorAll("[data-ren]").forEach(b => b.onclick = async () => {
    const st = sets.find(x => x.id === b.dataset.ren); if (!st) return;
    const n = prompt("Set name", st.name); if (!n || !n.trim()) return;
    const old = st.name; st.name = niceName(n.trim());
    try { await store.saveSet(st); } catch (e) { st.name = old; toast("Couldn\u2019t save the new name."); return; }
    render(); toast("Renamed.");
  });
  v.querySelectorAll("[data-del]").forEach(b => b.onclick = async () => {
    const s = sets.find(x => x.id === b.dataset.del); if (!s || !confirm(`Delete “${s.name}” and its cards from your binder?`)) return;
    try { await store.deleteSet(s.id); } catch (e) { toast("Couldn’t delete that set."); return; }
    sets = sets.filter(x => x.id !== s.id);
    forgetSet(s.id);
    if (state.active === s.id) state.active = "wildmoor";
    persist(); render(); toast("Set deleted.");
  });
}
async function doImport(){
  const st = $("#istatus"); const btn = $("#ido");
  const say = (m, err) => { st.textContent = m; st.classList.toggle("err", !!err); };
  const text = $("#ijson").value.trim(); const files = [...$("#iimgs").files];
  if (!text && !files.length && !pulled) return say("Add card data or some images first.", true);
  let raw = null, cards = [];
  if (text){
    try { raw = JSON.parse(text); } catch (e) { return say("That JSON doesn’t parse: " + e.message, true); }
    try { cards = normalizeCards(raw); } catch (e) { return say(e.message, true); }
  } else if (pulled){ cards = pulled.map(c => ({...c})); }
  btn.disabled = true;
  try {
    const byKey = new Map(); cards.forEach(c => { byKey.set(c.id, c); byKey.set(slug(c.name), c); if (c.image && !/^(https?:|data:|\/_blob\/)/.test(c.image)) byKey.set(slug(c.image.replace(/\.[^.]+$/, "")), c); });
    let i = 0, matched = 0, added = 0;
    for (const f of files){
      i++; say(`Processing image ${i} of ${files.length}…`);
      const stem = f.name.replace(/\.[^.]+$/, ""); const [base, rar] = stem.split("__");
      let card = byKey.get(slug(base));
      const blob = await resizeImage(f); const src = await store.uploadImage(blob);
      if (card){ card.image = src; matched++; }
      else if (!cards.length || (!text && !pulled)){
        const name = base.replace(/[-_]+/g, " ").replace(/\b\w/g, m => m.toUpperCase());
        card = {id: slug(base) || "img-" + i, no: cards.length + 1, name, rarity: normalizeRarity(rar), type:"", hp:"", move:"", dmg:"", image: src};
        cards.push(card); added++;
      }
    }
    cards.forEach(c => { if (c.image && !/^(https?:|data:|\/_blob\/)/.test(c.image)) c.image = null; });
    if (!cards.length) throw new Error("No cards found to import.");
    const name = $("#iname").value.trim() || (raw && !Array.isArray(raw) && (raw.name || raw.set?.name)) || pulledName || "My set";
    const set = {id: "set-" + (slug(name) || "custom") + "-" + Date.now().toString(36), name: niceName(name), scan: $("#iscan").checked, cards};
    say(`Saving ${cards.length} cards…`);
    await new Promise(r => setTimeout(r, 40));
    await store.saveSet(set);
    pulled = null; pulledName = ""; binderLimit = 60; binderFilter = "all";
    sets.push(set); state.active = set.id; session = null; persist();
    const noImg = cards.filter(c => !c.image).length;
    toast(`Imported ${cards.length} cards into “${set.name}”.`);
    render();
    $("#istatus").textContent = `Imported ${cards.length} cards${files.length ? `, ${matched + added} with uploaded images` : ""}${noImg ? `. ${noImg} have no image and will show their name instead.` : "."}`;
  } catch (e) {
    say(e.message || "Import failed.", true);
  } finally { const b = $("#ido"); if (b) b.disabled = false; }
}

/* ================= Boot ================= */
(async () => {
  store = await initStore();
  try { const s = await store.load(); if (s) state = Object.assign(DEFAULT_STATE(), s); } catch (e) { console.warn(e); }
  try { const extra = await store.listSets(); sets = [WILDMOOR, ...extra.filter(s => s && Array.isArray(s.cards))]; } catch (e) { console.warn(e); }
  document.body.classList.toggle("nofoil", !!state.noFoil); applyLite(); applyVariant(); checkAch(true);
  if (isHosted()){
    const l = document.createElement("link"); l.rel = "manifest"; l.href = "manifest.webmanifest"; document.head.appendChild(l);
    const ic = document.createElement("link"); ic.rel = "apple-touch-icon"; ic.href = "icon-192.png"; document.head.appendChild(ic);
    if ("serviceWorker" in navigator){
      const had = !!navigator.serviceWorker.controller;
      navigator.serviceWorker.register("sw.js").catch(() => {});
      navigator.serviceWorker.addEventListener("controllerchange", () => { if (had) toast("Updated. Close and reopen the app for the newest version."); });
    }
  }
  if (state.curShow && (!state.rates || Date.now() - state.rates.t > 864e5)) setTimeout(() => { refreshRates().then(() => render()).catch(() => {}); }, 3000);
  if (isHosted()) setTimeout(async () => { try { const l = await latestBuild(); if (l > BUILD) showUpdateBar(l); } catch {} }, 2500);
  render();
})();
})();
